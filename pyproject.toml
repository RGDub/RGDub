[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "punlabs-pipelines"
version = "0.1.4"
description = "Amazon SP-API, Ads API and Marketing Stream extractors feeding punlabs.AMZSales in BigQuery"
requires-python = ">=3.10"
dependencies = [
    "google-cloud-bigquery>=3.20",
    "google-auth>=2.20",
    "requests>=2.31",
    "pandas>=2.2",
    "pyarrow>=15",
    "db-dtypes>=1.2",
    "pandas-gbq>=0.26",
    "numpy>=1.26",
]

[project.optional-dependencies]
stream = ["boto3>=1.34"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["pipelines*"]
